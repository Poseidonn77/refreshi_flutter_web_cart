# Single source of truth for the GraphQL schema.
# graphql_codegen scans every *.graphql file under lib/, so types, scalars and
# the root Query must be defined exactly once (here).
#
# Conventions: types are PascalCase, fields/arguments are camelCase.

scalar ISODateTime

type Query {
  fetchCart(id: ID!): Cart
  fetchOrder(id: ID!): Order
  fetchPay(id: ID!): Pay
  # Order history, newest first.
  fetchOrders: [Order!]!
}

type Mutation {
  # Creates order `input.id` with its cart, and holds the payment
  # (sets Pay.holdRequestTime). The server captures it shortly after
  # (sets Pay.payCaptureTime) and the order becomes CONFIRMED.
  placeOrder(input: PlaceOrderInput!): Order
}

input PlaceOrderInput {
  # The cart id; the order and its payment share it.
  id: ID!
  items: [String!]!
  amountInCents: Int!
  timeSlotStart: ISODateTime!
  timeSlotEnd: ISODateTime!
}

enum OrderStatus {
  # Placed; payment is on hold.
  PLACED
  # Payment captured; waiting for the delivery slot.
  CONFIRMED
  # Inside the delivery slot.
  OUT_FOR_DELIVERY
  # Delivery slot has ended.
  DELIVERED
}

type Cart {
  id: ID!
  items: [String!]
  lastUpdated: ISODateTime
}

type Pay {
  id: ID!
  holdRequestTime: ISODateTime
  payCaptureTime: ISODateTime
  amountInCents: Int
}

type Order {
  id: ID!
  dateOfOrder: ISODateTime
  cart: Cart
  pay: Pay
  timeSlotStart: ISODateTime
  timeSlotEnd: ISODateTime
  status: OrderStatus!
}
